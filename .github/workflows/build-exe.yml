name: Build Windows EXE

on:
  push:
    paths:
      - 'port-checker/port_checker.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          cd port-checker
          pyinstaller --onefile --console --name "RyR_PortChecker" port_checker.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyR_PortChecker_Windows
          path: port-checker/dist/RyR_PortChecker.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "RyR Port Checker - Windows"
          files: port-checker/dist/RyR_PortChecker.exe
          body: "Ejecutable Windows sin necesidad de instalar Python."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
